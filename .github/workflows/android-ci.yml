name: Android CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew ktlintCheck detekt

      - name: Unit test
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Decode upload keystore (when secrets present)
        id: keystore
        env:
          DOCKMODE_KEYSTORE_BASE64: ${{ secrets.DOCKMODE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${DOCKMODE_KEYSTORE_BASE64}" ]; then
            mkdir -p "$RUNNER_TEMP/keystore"
            KS_PATH="$RUNNER_TEMP/keystore/dockmode-upload.jks"
            echo "$DOCKMODE_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            echo "path=$KS_PATH" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Upload keystore decoded to $KS_PATH"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "::error::DOCKMODE_KEYSTORE_BASE64 is required for GitHub Release APKs."
              exit 1
            fi
            echo "::warning::DOCKMODE_KEYSTORE_BASE64 not set — release builds may be unsigned."
          fi

      - name: Build release APK and Play Console AAB
        env:
          DOCKMODE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          DOCKMODE_KEYSTORE_PASSWORD: ${{ secrets.DOCKMODE_KEYSTORE_PASSWORD }}
          DOCKMODE_KEY_PASSWORD: ${{ secrets.DOCKMODE_KEY_PASSWORD }}
          DOCKMODE_KEY_ALIAS: ${{ secrets.DOCKMODE_KEY_ALIAS }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Collect release artifacts (rename with tag when present)
        id: collect
        run: |
          set -e
          mkdir -p release-assets

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="dev-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAB_SRC=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          MAPPING_SRC="app/build/outputs/mapping/release/mapping.txt"

          cp "$APK_SRC" "release-assets/dockmode-${TAG}-release.apk"
          cp "$AAB_SRC" "release-assets/dockmode-${TAG}-release.aab"
          if [ -f "$MAPPING_SRC" ]; then
            cp "$MAPPING_SRC" "release-assets/dockmode-${TAG}-mapping.txt"
            echo "mapping=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R8 mapping.txt not found at $MAPPING_SRC — was minifyEnabled set?"
            echo "mapping=false" >> "$GITHUB_OUTPUT"
          fi

          ls -lh release-assets/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dockmode-release-apk
          path: release-assets/dockmode-*-release.apk
          if-no-files-found: error

      - name: Upload Play Console AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockmode-release-aab
          path: release-assets/dockmode-*-release.aab
          if-no-files-found: error

      - name: Upload mapping
        if: steps.collect.outputs.mapping == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dockmode-mapping
          path: release-assets/dockmode-*-mapping.txt
          if-no-files-found: warn

      - name: Resolve release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using hand-written notes from $NOTES_FILE"
            echo "body_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "No $NOTES_FILE found, using auto-generated notes"
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          fail_on_unmatched_files: false
          files: |
            release-assets/dockmode-*-release.apk
            release-assets/dockmode-*-mapping.txt
